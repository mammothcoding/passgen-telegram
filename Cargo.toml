[package]
name = "passgen-telegram"
version = "1.0.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "Telegram bot-service for generating cryptographically secure passwords/tokens and other sets and sequences."
readme = "README.md"
authors = ["Mamontov Konstantin <k@mamont.xyz>"]
homepage = "https://github.com/mammothcoding/passgen-cmd"
repository = "https://github.com/mammothcoding/passgen-cmd"
keywords = ["generator", "password", "token", "crypto-resistant", "telegram-bot"]
categories = ["authentication", "cryptography"]
exclude = [".*"]

[features]
default = ["native-tls", "ctrlc_handler", "teloxide-core/default"]

webhooks = ["rand"]
webhooks-axum = ["webhooks", "axum", "tower", "tower-http"]

cbor-serializer = ["serde_cbor"]
bincode-serializer = ["bincode"]

macros = ["teloxide-macros"]

ctrlc_handler = ["tokio/signal"]

native-tls = ["teloxide-core/native-tls"]
rustls = ["teloxide-core/rustls"]
rustls-native-roots = ["teloxide-core/rustls-native-roots"]
throttle = ["teloxide-core/throttle"]
cache-me = [
    "teloxide-core/cache_me",
] # FIXME: why teloxide and core use - _ differently?
trace-adaptor = ["teloxide-core/trace_adaptor"]
erased = ["teloxide-core/erased"]

# currently used for `README.md` tests, building docs for `docsrs` to add `This is supported on feature="..." only.`,
# and for teloxide-core.
nightly = ["teloxide-core/nightly"]

full = [
    "webhooks",
    "webhooks-axum",
    "cbor-serializer",
    "bincode-serializer",
    "macros",
    "ctrlc_handler",
    "teloxide-core/full",
    "native-tls",
    "rustls",
    "throttle",
    "cache-me",
    "trace-adaptor",
    "erased",
]


[dependencies]
teloxide = { version = "0.13.0", features = ["macros", "webhooks", "webhooks-axum", "bincode-serializer"] }
teloxide-core = { version = "*", default-features = false }
teloxide-macros = { version = "0.8", optional = true }

serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }

dptree = "0.3.0"

# Uncomment this if you want to test teloxide with a specific dptree commit
# dptree = { git = "https://github.com/teloxide/dptree", rev = "df578e4" }

tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
tokio-util = "0.7"
tokio-stream = "0.1"

url = "2.2"
log = "0.4"
bytes = "1"
mime = "0.3"

derive_more = "0.99"
thiserror = "1.0"
futures = "0.3"
pin-project = "1.0"
aquamarine = "0.5.0"
either = "1.9.0"

#sqlx = { version = "^0.7.3", optional = true, default-features = false, features = [
#    "macros",
#    "sqlite",
#    "postgres"
#] }
libsqlite3-sys = "0.30.1"
sqlx = "0.8.2"
sqlx-cli = "0.8.2"

deadpool-redis = { version = "0.14", features = ["rt_tokio_1"], optional = true }
serde_cbor = { version = "0.11", optional = true }
bincode = { version = "1.3", optional = true }
axum = { version = "0.7.0", optional = true }
tower = { version = "0.5.0", optional = true }
tower-http = { version = "0.5.2", features = ["trace"], optional = true }
rand = { version = "0.8.5", optional = true }

env-file-reader = "=0.3.0"
passgen-lib = "1.0.4"

# Reduce the size of the executable  file:
[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
panic = 'abort'
strip = true
